<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intermission — Page Not Found | Spotlight</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FBF3F4; --ink:#2B222E; --ink-soft:#6B5D68; --coral:#D9634A; --coral-deep:#A8432E; --line:rgba(43,34,46,0.15); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Work Sans',sans-serif; background:var(--paper); color:var(--ink-soft); min-height:100svh; display:flex; align-items:center; justify-content:center; text-align:center; padding:32px; }
  .wrap{ max-width:460px; }
  .mono{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--coral-deep); padding:6px 12px; border:1px solid var(--coral); border-radius:20px; background:#FBDFD6; display:inline-block; margin-bottom:22px; }
  h1{ font-family:'Fraunces',serif; font-size:clamp(34px,7vw,56px); color:var(--ink); font-weight:600; }
  h1 em{ font-style:italic; color:var(--coral-deep); }
  p{ margin:18px 0 32px; font-size:15.5px; line-height:1.6; }
  a.btn{ display:inline-flex; align-items:center; gap:8px; padding:14px 28px; font-size:14px; font-weight:700; border-radius:2px; background:var(--coral); color:#fff; text-decoration:none; }
  a.btn:hover{ background:var(--coral-deep); }
</style>
</head>
<body>
  <div class="wrap">
    <span class="mono">Act 404 — Intermission</span>
    <h1>This <em>act</em> isn't playing.</h1>
    <p>The page you're looking for has left the stage — it may have been moved, renamed, or never booked a slot. Let's get you back to the show.</p>
    <a class="btn" href="/">Back to Spotlight</a>
  </div>
</body>
</html>
